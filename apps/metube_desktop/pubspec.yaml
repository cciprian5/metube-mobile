name: metube_desktop
description: "MeTube Ember — the server owner's edition for Windows."
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  mt_core:
    path: ../../packages/mt_core
  mt_media:
    path: ../../packages/mt_media
  mt_transcripts:
    path: ../../packages/mt_transcripts
  mt_ui:
    path: ../../packages/mt_ui
  # The same ranges as Super, so the shared resolution does not move.
  cached_network_image: ^3.4.1
  # Covers are cached under the app's local data folder rather than the
  # system temp folder; these two name the cache's directory and index.
  file: ^7.0.1
  flutter_cache_manager: ^3.4.1
  flutter_riverpod: ^2.6.1
  # The server password, encrypted for this Windows user (DPAPI); the
  # phones' own range.
  flutter_secure_storage: ^9.2.2
  go_router: ^16.2.0
  # The running version, for About and "what's new"; the phones' range,
  # already in the shared resolution.
  package_info_plus: ^9.0.0
  # Already in the shared resolution at this version; makes the covers
  # taken from video frames card-sized.
  image: ^4.9.2
  path_provider: ^2.1.5
  # Windows' own folder dialog, for the offline and download folders and
  # "ask me every time".
  file_selector: 1.1.0
  # The Videos known folder (the default offline folder), which
  # path_provider does not name; the version already in the resolution.
  path_provider_windows: 2.3.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  # No audio_service, just_audio, video_player, flutter_background or
  # receive_sharing_intent: they are the phones' playback and share paths,
  # and Windows has its own (media_kit, SMTC, drag and drop).
  #
  # Exact pins: each version below was built and measured on this machine
  # (Flutter 3.47.2) before any screen was written.
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_windows_video: 1.0.11
  smtc_windows: 1.1.0
  # smtc_windows ships Rust bindings generated with 2.11.1 and refuses any
  # other runtime at start-up; pub would otherwise pick the newest.
  flutter_rust_bridge: 2.11.1
  window_manager: 0.5.2
  screen_retriever: 0.2.2
  # Both drag directions: desktop_drop cannot share the window's single OLE
  # drop registration with this package, so it is not used at all.
  super_drag_and_drop: 0.9.1
  # 1.2.0 needs win32 6, which super_drag_and_drop's win32 5 rules out.
  windows_single_instance: 1.1.0
  # The icon by the clock, for playing on after the window closes. 0.8
  # builds a C library through native assets; 0.5 is a plain plugin by the
  # author of window_manager.
  tray_manager: 0.5.0
  # Download progress on the taskbar button, its count, and the preview's
  # play buttons.
  windows_taskbar: 1.1.2
  # Windows notifications (a download done or failed, a new arrival),
  # clicked to open what they name.
  local_notifier: 0.1.6
  # The optional play/pause key that works with the window behind others;
  # off until chosen.
  hotkey_manager: 0.2.3
  # The optional start with Windows, into the tray; off until chosen.
  launch_at_startup: 0.5.1
  # Asks Windows whether the play key's combination is free, which
  # hotkey_manager does not report; the version already in the resolution.
  win32: 5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs the real media_kit engine on Windows, which a widget test cannot.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # The tray icon, the taskbar preview's buttons and its count badges,
    # drawn by tool/icons/make_tray_icons.py.
    - assets/tray/
