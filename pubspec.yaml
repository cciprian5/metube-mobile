# The workspace root of the monorepo. See docs/ARCHITECTURE.md.
name: mtf_workspace
publish_to: none
environment:
  sdk: ^3.13.0

workspace:
  - packages/mt_core
  - packages/mt_transcripts
  - packages/mt_media
  - packages/mt_ui
  - apps/metube_lite
  - apps/metube_super
  - apps/metube_desktop

# audio_service 0.18.19, media_kit_video 2.0.1 and windows_taskbar 1.1.2,
# each with fixes, kept in third_party until upstream has them: see the
# PATCHES.md in each folder.
dependency_overrides:
  audio_service:
    path: third_party/audio_service
  media_kit_video:
    path: third_party/media_kit_video
  windows_taskbar:
    path: third_party/windows_taskbar
